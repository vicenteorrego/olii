<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ajedrez</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
}

/* =========================
   INICIO
========================= */

#home {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
    background:
        radial-gradient(circle at 15% 20%, #ff6b6b, transparent 25%),
        radial-gradient(circle at 85% 20%, #4dabf7, transparent 25%),
        radial-gradient(circle at 50% 100%, #845ef7, transparent 35%),
        linear-gradient(135deg, #667eea, #764ba2);
}

.home-card {
    width: min(90%, 560px);
    padding: 45px 30px;
    text-align: center;
    border-radius: 28px;
    background: rgba(255,255,255,.95);
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    position: relative;
    z-index: 2;
}

.logo {
    font-size: 80px;
    margin-bottom: 5px;
}

.title {
    margin: 0;
    font-size: 58px;
    font-weight: bold;
    background: linear-gradient(
        90deg,
        #4285f4,
        #9c27b0,
        #ea4335,
        #fbbc05
    );
    -webkit-background-clip: text;
    color: transparent;
}

.subtitle {
    color: #5f6368;
    font-size: 19px;
    margin: 12px 0 30px;
}

.start-button {
    border: none;
    border-radius: 30px;
    padding: 15px 45px;
    font-size: 18px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    background: linear-gradient(90deg, #4285f4, #8e44ad);
    box-shadow: 0 7px 20px rgba(0,0,0,.2);
    transition: .2s;
}

.start-button:hover {
    transform: translateY(-3px) scale(1.04);
}

.floating {
    position: absolute;
    color: white;
    opacity: .15;
    font-size: 100px;
    animation: float 5s infinite ease-in-out;
}

.f1 { left: 8%; top: 15%; }
.f2 { right: 8%; top: 18%; animation-delay: 1s; }
.f3 { left: 12%; bottom: 10%; animation-delay: 2s; }
.f4 { right: 12%; bottom: 12%; animation-delay: 3s; }

@keyframes float {
    0%,100% {
        transform: translateY(0) rotate(-5deg);
    }
    50% {
        transform: translateY(-20px) rotate(5deg);
    }
}

/* =========================
   JUEGO
========================= */

#game {
    display: none;
    min-height: 100vh;
    padding: 20px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,220,160,.2),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #33485c,
            #172333 60%,
            #101722
        );
    color: white;
}

.game-container {
    width: 100%;
    max-width: 900px;
    margin: auto;
}

.game-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.game-title {
    margin: 0;
    font-size: 30px;
    text-shadow: 0 2px 5px black;
}

.back-button {
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(255,255,255,.12);
    color: white;
    padding: 8px 14px;
    border-radius: 7px;
    cursor: pointer;
}

.back-button:hover {
    background: rgba(255,255,255,.25);
}

/* =========================
   ZONA PRINCIPAL
========================= */

.game-area {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 25px;
}

/* =========================
   MARCADOR
========================= */

.scoreboard {
    width: 140px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.score-card {
    background: white;
    color: #202124;
    border-radius: 14px;
    padding: 14px 10px;
    text-align: center;
    box-shadow: 0 7px 18px rgba(0,0,0,.35);
}

.score-name {
    font-size: 14px;
    color: #5f6368;
    margin-bottom: 5px;
}

.score {
    font-size: 32px;
    font-weight: bold;
}

.rounds {
    text-align: center;
    font-size: 13px;
    color: #e5e7eb;
}

/* =========================
   SECCIÓN TABLERO
========================= */

.board-section {
    display: flex;
    flex-direction: column;
    align-items: center;
}

/* =========================
   CONTROLES
========================= */

.controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    flex-wrap: wrap;
    margin-bottom: 6px;
}

.controls label {
    font-size: 14px;
}

select,
.new-game-button {
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 14px;
    cursor: pointer;
}

.new-game-button {
    background: #1a73e8;
    color: white;
}

.new-game-button:hover {
    background: #1765c1;
}

#status {
    min-height: 25px;
    margin: 4px 0 8px;
    font-size: 17px;
    font-weight: bold;
    text-shadow: 0 2px 4px black;
}

/* =========================
   MESA
========================= */

.table {
    padding: 25px;
    border-radius: 18px;

    background:
        repeating-linear-gradient(
            90deg,
            #5d351a 0px,
            #70421f 35px,
            #4d2b15 70px,
            #6a3b1b 105px
        );

    border: 8px solid #3e210f;

    box-shadow:
        0 20px 35px rgba(0,0,0,.6),
        inset 0 3px 6px rgba(255,255,255,.12),
        inset 0 -5px 12px rgba(0,0,0,.4);
}

/* =========================
   TABLERO
========================= */

.board {
    width: 480px;
    height: 480px;

    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border: 4px solid #211208;

    box-shadow:
        0 8px 18px rgba(0,0,0,.55);
}

.square {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
    user-select: none;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

/* =========================
   PIEZAS
========================= */

.piece {
    font-size: 42px;
    line-height: 1;
    pointer-events: none;
    z-index: 2;
    text-shadow: 1px 2px 2px rgba(0,0,0,.5);
}

.white-piece {
    color: white;
}

.black-piece {
    color: #111;
}

.selected {
    box-shadow: inset 0 0 0 4px #34a853;
}

.possible::after {
    content: "";
    position: absolute;
    width: 15px;
    height: 15px;
    border-radius: 50%;
    background: rgba(0,0,0,.3);
}

.capture {
    box-shadow: inset 0 0 0 4px #ea4335;
}

.check {
    box-shadow: inset 0 0 0 5px #ea4335;
}

/* =========================
   MENSAJE GANADOR
========================= */

#winnerMessage {
    display: none;
    margin: 8px auto;
    padding: 11px 18px;
    border-radius: 12px;
    background: #ffe69c;
    color: #664d03;
    font-weight: bold;
    box-shadow: 0 3px 10px rgba(0,0,0,.3);
}

.info {
    margin-top: 9px;
    color: rgba(255,255,255,.75);
    font-size: 13px;
}

/* =========================
   RESPONSIVE
========================= */

@media (max-width: 800px) {

    .game-area {
        flex-direction: column;
    }

    .scoreboard {
        width: auto;
        flex-direction: row;
        justify-content: center;
        order: -1;
    }

    .score-card {
        min-width: 120px;
    }
}

@media (max-width: 550px) {

    .title {
        font-size: 45px;
    }

    .logo {
        font-size: 65px;
    }

    .board {
        width: 82vw;
        height: 82vw;
    }

    .piece {
        font-size: 9vw;
    }

    .table {
        padding: 12px;
        border-width: 5px;
    }

    .game-title {
        font-size: 24px;
    }
}
</style>
</head>

<body>

<!-- =========================
     INICIO
========================= -->

<section id="home">

    <div class="floating f1">♟</div>
    <div class="floating f2">♞</div>
    <div class="floating f3">♜</div>
    <div class="floating f4">♛</div>

    <div class="home-card">

        <div class="logo">♟</div>

        <h1 class="title">
            Ajedrez
        </h1>

        <div class="subtitle">
            ¡Pon a prueba tu estrategia!
        </div>

        <button
            class="start-button"
            id="startButton"
        >
            ♟ Comenzar partida
        </button>

    </div>

</section>


<!-- =========================
     JUEGO
========================= -->

<section id="game">

    <div class="game-container">

        <div class="game-header">

            <h1 class="game-title">
                ♟ Ajedrez
            </h1>

            <button
                class="back-button"
                id="backButton"
            >
                ← Inicio
            </button>

        </div>


        <div class="game-area">

            <!-- MARCADOR -->

            <div class="scoreboard">

                <div class="score-card">

                    <div
                        class="score-name"
                        id="whiteName"
                    >
                        ♔ Blancas
                    </div>

                    <div
                        class="score"
                        id="whiteScore"
                    >
                        0
                    </div>

                </div>


                <div class="score-card">

                    <div
                        class="score-name"
                        id="blackName"
                    >
                        ♚ Negras
                    </div>

                    <div
                        class="score"
                        id="blackScore"
                    >
                        0
                    </div>

                </div>


                <div class="rounds">

                    Rondas jugadas:
                    <strong id="roundCount">
                        0
                    </strong>

                </div>

            </div>


            <!-- TABLERO -->

            <div class="board-section">

                <div class="controls">

                    <label>
                        Modo:
                    </label>

                    <select id="mode">

                        <option value="2">
                            2 jugadores
                        </option>

                        <option value="1">
                            1 jugador vs computadora
                        </option>

                    </select>

                    <button
                        class="new-game-button"
                        id="newGame"
                    >
                        Nueva partida
                    </button>

                </div>


                <div id="status">
                    Turno: Blancas
                </div>


                <div id="winnerMessage"></div>


                <div class="table">

                    <div
                        id="board"
                        class="board"
                    ></div>

                </div>


                <div class="info">
                    Haz clic en una pieza y después en la casilla donde quieres moverla.
                </div>

            </div>

        </div>

    </div>

</section>


<script>

/* =========================
   PANTALLAS
========================= */

const home =
    document.getElementById("home");

const game =
    document.getElementById("game");

document.getElementById("startButton")
    .addEventListener("click", () => {

        home.style.display = "none";
        game.style.display = "block";

    });

document.getElementById("backButton")
    .addEventListener("click", () => {

        game.style.display = "none";
        home.style.display = "flex";

    });


/* =========================
   AJEDREZ
========================= */

let chess = new Chess();

let selectedSquare = null;

let computerThinking = false;

let whiteWins = 0;

let blackWins = 0;

let rounds = 0;

let gameCounted = false;


/* =========================
   PIEZAS
========================= */

const symbols = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"

};


/* =========================
   ELEMENTOS
========================= */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const modeElement =
    document.getElementById("mode");

const winnerMessage =
    document.getElementById("winnerMessage");

const whiteScore =
    document.getElementById("whiteScore");

const blackScore =
    document.getElementById("blackScore");

const roundCount =
    document.getElementById("roundCount");

const whiteName =
    document.getElementById("whiteName");

const blackName =
    document.getElementById("blackName");


/* =========================
   MARCADOR
========================= */

function updateScoreboard() {

    whiteScore.textContent = whiteWins;

    blackScore.textContent = blackWins;

    roundCount.textContent = rounds;

    if (modeElement.value === "1") {

        whiteName.textContent = "♔ Jugador";
        blackName.textContent = "♚ Computadora";

    } else {

        whiteName.textContent = "♔ Blancas";
        blackName.textContent = "♚ Negras";

    }
}


/* =========================
   NUEVA PARTIDA
========================= */

function newGame() {

    chess.reset();

    selectedSquare = null;

    computerThinking = false;

    gameCounted = false;

    winnerMessage.style.display = "none";

    winnerMessage.textContent = "";

    drawBoard();

    updateStatus();

    updateScoreboard();
}


/* =========================
   DIBUJAR TABLERO
========================= */

function drawBoard() {

    boardElement.innerHTML = "";

    const board = chess.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const square =
                document.createElement("div");

            square.className =
                "square " +
                ((row + col) % 2 === 0
                    ? "light"
                    : "dark");

            const file =
                String.fromCharCode(97 + col);

            const rank = 8 - row;

            const squareName =
                file + rank;

            square.dataset.square =
                squareName;


            if (
                selectedSquare === squareName
            ) {

                square.classList.add("selected");

            }


            if (selectedSquare) {

                const moves =
                    chess.moves({
                        square: selectedSquare,
                        verbose: true
                    });

                const move =
                    moves.find(
                        m => m.to === squareName
                    );

                if (move) {

                    if (move.captured) {

                        square.classList.add("capture");

                    } else {

                        square.classList.add("possible");

                    }

                }
            }


            const piece =
                board[row][col];

            if (piece) {

                const element =
                    document.createElement("span");

                element.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );

                element.textContent =
                    symbols[
                        piece.color + piece.type
                    ];

                square.appendChild(element);
            }


            square.addEventListener(
                "click",
                () => handleSquareClick(squareName)
            );

            boardElement.appendChild(square);
        }
    }


    if (chess.in_check()) {

        const kingSquare =
            findKingSquare(chess.turn());

        if (kingSquare) {

            const king =
                document.querySelector(
                    `[data-square="${kingSquare}"]`
                );

            if (king) {
                king.classList.add("check");
            }
        }
    }
}


/* =========================
   BUSCAR REY
========================= */

function findKingSquare(color) {

    const board = chess.board();

    for (let row = 0; row < 8; row++) {

        for (let col = 0; col < 8; col++) {

            const piece = board[row][col];

            if (
                piece &&
                piece.color === color &&
                piece.type === "k"
            ) {

                return (
                    String.fromCharCode(97 + col) +
                    (8 - row)
                );

            }
        }
    }

    return null;
}


/* =========================
   CLICK EN TABLERO
========================= */

function handleSquareClick(square) {

    if (chess.game_over()) {
        return;
    }

    if (computerThinking) {
        return;
    }

    if (
        modeElement.value === "1" &&
        chess.turn() === "b"
    ) {
        return;
    }


    const piece = chess.get(square);


    if (selectedSquare) {

        const moves =
            chess.moves({
                square: selectedSquare,
                verbose: true
            });

        const move =
            moves.find(
                m => m.to === square
            );


        if (move) {

            chess.move({
                from: selectedSquare,
                to: square,
                promotion: "q"
            });

            selectedSquare = null;

            drawBoard();

            updateStatus();


            if (
                !chess.game_over() &&
                modeElement.value === "1" &&
                chess.turn() === "b"
            ) {

                computerThinking = true;

                setTimeout(
                    computerMove,
                    500
                );
            }

            return;
        }


        if (
            piece &&
            piece.color === chess.turn()
        ) {

            selectedSquare = square;

            drawBoard();

            return;
        }


        selectedSquare = null;

        drawBoard();

        return;
    }


    if (
        piece &&
        piece.color === chess.turn()
    ) {

        selectedSquare = square;

        drawBoard();
    }
}


/* =========================
   COMPUTADORA
========================= */

function computerMove() {

    if (
        chess.game_over() ||
        chess.turn() !== "b"
    ) {

        computerThinking = false;

        return;
    }


    const moves =
        chess.moves({
            verbose: true
        });


    if (!moves.length) {

        computerThinking = false;

        return;
    }


    const captures =
        moves.filter(
            move => move.captured
        );


    const choices =
        captures.length
            ? captures
            : moves;


    const move =
        choices[
            Math.floor(
                Math.random() * choices.length
            )
        ];


    chess.move({
        from: move.from,
        to: move.to,
        promotion: "q"
    });


    computerThinking = false;

    drawBoard();

    updateStatus();
}


/* =========================
   FINAL DE PARTIDA
========================= */

function finishGame() {

    if (
        !chess.game_over() ||
        gameCounted
    ) {
        return;
    }

    gameCounted = true;

    rounds++;


    if (chess.in_checkmate()) {

        if (chess.turn() === "w") {

            blackWins++;

            winnerMessage.textContent =
                modeElement.value === "1"
                    ? "🏆 ¡La computadora ganó!"
                    : "🏆 ¡Las negras ganaron!";

        } else {

            whiteWins++;

            winnerMessage.textContent =
                "🏆 ¡Las blancas ganaron!";

        }

    } else {

        winnerMessage.textContent =
            "🤝 ¡La partida terminó en tablas!";

    }


    winnerMessage.style.display = "block";

    updateScoreboard();
}


/* =========================
   ESTADO
========================= */

function updateStatus() {

    if (chess.in_checkmate()) {

        statusElement.textContent =
            "🏆 ¡JAQUE MATE!";

        finishGame();

        return;
    }


    if (
        chess.is_stalemate() ||
        chess.isThreefoldRepetition() ||
        chess.insufficient_material() ||
        chess.in_draw()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas!";

        finishGame();

        return;
    }


    const turn =
        chess.turn() === "w"
            ? "Blancas"
            : "Negras";


    if (chess.in_check()) {

        statusElement.textContent =
            "⚠️ ¡Jaque! Turno: " + turn;

    } else {

        statusElement.textContent =
            "Turno: " + turn;

    }
}


/* =========================
   NUEVA PARTIDA
========================= */

document.getElementById("newGame")
    .addEventListener(
        "click",
        newGame
    );


/* =========================
   CAMBIAR MODO
========================= */

modeElement.addEventListener(
    "change",
    () => {

        whiteWins = 0;
        blackWins = 0;
        rounds = 0;

        newGame();
    }
);


/* =========================
   INICIAR
========================= */

newGame();

</script>

</body>
</html>
