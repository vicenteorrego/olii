<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajedrez</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    color: #202124;
}


/* =====================================================
   PANTALLA DE INICIO
===================================================== */

#home {
    min-height: 100vh;

    position: relative;
    overflow: hidden;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;

    background:
        radial-gradient(
            circle at 20% 20%,
            #ff6b6b 0%,
            transparent 28%
        ),
        radial-gradient(
            circle at 80% 20%,
            #4dabf7 0%,
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 100%,
            #845ef7 0%,
            transparent 40%
        ),
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );
}


/* Piezas decorativas */

.floating-piece {
    position: absolute;

    font-size: 90px;

    opacity: .18;

    animation: float 5s ease-in-out infinite;

    user-select: none;
}

.piece1 {
    left: 8%;
    top: 15%;
}

.piece2 {
    right: 10%;
    top: 20%;

    animation-delay: 1s;
}

.piece3 {
    left: 15%;
    bottom: 12%;

    animation-delay: 2s;
}

.piece4 {
    right: 15%;
    bottom: 10%;

    animation-delay: 3s;
}


@keyframes float {

    0%, 100% {
        transform: translateY(0) rotate(-5deg);
    }

    50% {
        transform: translateY(-20px) rotate(5deg);
    }

}


/* Tarjeta principal */

.home-card {
    position: relative;
    z-index: 2;

    width: 100%;
    max-width: 560px;

    padding: 45px 35px;

    border-radius: 28px;

    background: rgba(255,255,255,.94);

    box-shadow:
        0 20px 60px rgba(0,0,0,.25);

    backdrop-filter: blur(10px);
}


/* Logo */

.logo {
    font-size: 80px;

    line-height: 1;

    margin-bottom: 10px;

    filter:
        drop-shadow(
            0 8px 5px rgba(0,0,0,.2)
        );
}


/* Título */

.title {
    margin: 0;

    font-size: 58px;

    font-weight: 800;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9c27b0,
            #ea4335,
            #fbbc05
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}


.subtitle {
    margin: 12px 0 30px;

    font-size: 19px;

    color: #5f6368;
}


/* Botón */

.start-button {
    border: none;

    padding: 15px 50px;

    border-radius: 30px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e44ad
        );

    box-shadow:
        0 6px 18px rgba(66,133,244,.4);

    transition: .25s;
}


.start-button:hover {
    transform: translateY(-3px) scale(1.04);

    box-shadow:
        0 10px 25px rgba(66,133,244,.5);
}


/* =====================================================
   JUEGO
===================================================== */

#game {
    display: none;

    min-height: 100vh;

    background:
        linear-gradient(
            135deg,
            #eef2ff,
            #f8f9fa
        );

    padding: 25px 15px 40px;
}


.game-container {
    width: 100%;

    max-width: 650px;

    margin: auto;

    text-align: center;
}


/* Cabecera */

.game-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}


.game-title {
    margin: 0;

    font-size: 28px;

    font-weight: 700;
}


.back-button {
    border: 1px solid #dadce0;

    background: white;

    color: #1a73e8;

    border-radius: 7px;

    padding: 8px 14px;

    cursor: pointer;
}


.back-button:hover {
    background: #f1f3f4;
}


/* =====================================================
   MARCADOR
===================================================== */

.scoreboard {
    display: flex;

    justify-content: center;

    gap: 12px;

    margin: 10px auto 15px;

    flex-wrap: wrap;
}


.score-card {
    min-width: 135px;

    padding: 10px 18px;

    border-radius: 12px;

    background: white;

    box-shadow:
        0 2px 8px rgba(0,0,0,.12);

    border: 1px solid #e0e0e0;
}


.score-name {
    font-size: 13px;

    color: #5f6368;

    margin-bottom: 3px;
}


.score {
    font-size: 28px;

    font-weight: bold;

    color: #202124;
}


.rounds {
    margin-top: 5px;

    color: #5f6368;

    font-size: 13px;
}


/* =====================================================
   CONTROLES
===================================================== */

.controls {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 10px;
}


.controls label {
    color: #5f6368;

    font-size: 14px;
}


select,
.new-game-button {
    border: 1px solid #dadce0;

    background: white;

    color: #202124;

    border-radius: 6px;

    padding: 8px 12px;

    font-size: 14px;

    cursor: pointer;
}


.new-game-button {
    background: #1a73e8;

    color: white;

    border-color: #1a73e8;
}


.new-game-button:hover {
    background: #1765c1;
}


/* =====================================================
   ESTADO
===================================================== */

#status {
    min-height: 25px;

    margin: 8px 0 10px;

    font-size: 17px;

    font-weight: 600;
}


/* =====================================================
   TABLERO
===================================================== */

.board {
    width: 480px;

    height: 480px;

    max-width: 90vw;

    max-height: 90vw;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(8, 1fr);

    grid-template-rows: repeat(8, 1fr);

    border: 4px solid #3c4043;

    box-shadow:
        0 8px 25px rgba(0,0,0,.2);
}


.square {
    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    user-select: none;
}


.light {
    background: #f0d9b5;
}


.dark {
    background: #b58863;
}


/* =====================================================
   PIEZAS
===================================================== */

.piece {
    font-size: 42px;

    line-height: 1;

    pointer-events: none;

    position: relative;

    z-index: 2;

    text-shadow:
        1px 2px 2px rgba(0,0,0,.45);
}


.white-piece {
    color: white;
}


.black-piece {
    color: #111;
}


.selected {
    box-shadow:
        inset 0 0 0 4px #34a853;
}


.possible::after {
    content: "";

    position: absolute;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: rgba(0,0,0,.3);
}


.capture {
    box-shadow:
        inset 0 0 0 4px #ea4335;
}


.check {
    box-shadow:
        inset 0 0 0 5px #ea4335;
}


/* =====================================================
   MENSAJE DE VICTORIA
===================================================== */

#winnerMessage {
    display: none;

    margin: 12px auto;

    padding: 12px;

    max-width: 400px;

    border-radius: 12px;

    background:
        linear-gradient(
            90deg,
            #fff3cd,
            #ffe69c
        );

    color: #664d03;

    font-size: 17px;

    font-weight: bold;

    box-shadow:
        0 3px 10px rgba(0,0,0,.12);
}


.info {
    margin-top: 10px;

    color: #5f6368;

    font-size: 13px;
}


/* =====================================================
   RESPONSIVE
===================================================== */

@media (max-width: 550px) {

    .home-card {
        padding: 35px 20px;
    }

    .title {
        font-size: 45px;
    }

    .logo {
        font-size: 65px;
    }

    .board {
        width: 90vw;
        height: 90vw;
    }

    .piece {
        font-size: 9.5vw;
    }

    .game-header {
        padding: 0 5px;
    }

    .floating-piece {
        font-size: 60px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     INICIO
===================================================== -->

<section id="home">

    <div class="floating-piece piece1">♟</div>
    <div class="floating-piece piece2">♞</div>
    <div class="floating-piece piece3">♜</div>
    <div class="floating-piece piece4">♛</div>


    <div class="home-card">

        <div class="logo">
            ♟
        </div>

        <h1 class="title">
            Ajedrez
        </h1>

        <div class="subtitle">
            ¡Pon a prueba tu estrategia!
        </div>

        <button
            class="start-button"
            id="startButton"
        >
            ♟ Comenzar partida
        </button>

    </div>

</section>



<!-- =====================================================
     JUEGO
===================================================== -->

<section id="game">

    <div class="game-container">


        <div class="game-header">

            <h1 class="game-title">
                ♟ Ajedrez
            </h1>

            <button
                class="back-button"
                id="backButton"
            >
                ← Inicio
            </button>

        </div>


        <!-- MARCADOR -->

        <div class="scoreboard">

            <div class="score-card">

                <div
                    class="score-name"
                    id="whiteName"
                >
                    ♔ Blancas
                </div>

                <div
                    class="score"
                    id="whiteScore"
                >
                    0
                </div>

            </div>


            <div class="score-card">

                <div
                    class="score-name"
                    id="blackName"
                >
                    ♚ Negras
                </div>

                <div
                    class="score"
                    id="blackScore"
                >
                    0
                </div>

            </div>

        </div>


        <div class="rounds">
            Rondas jugadas:
            <span id="roundCount">0</span>
        </div>


        <div class="controls">

            <label>
                Modo:
            </label>

            <select id="mode">

                <option value="2">
                    2 jugadores
                </option>

                <option value="1">
                    1 jugador vs computadora
                </option>

            </select>


            <button
                class="new-game-button"
                id="newGame"
            >
                Nueva partida
            </button>

        </div>


        <div id="status">
            Turno: Blancas
        </div>


        <div id="winnerMessage"></div>


        <div
            id="board"
            class="board"
        ></div>


        <div class="info">
            Haz clic en una pieza y después en la casilla donde quieres moverla.
        </div>

    </div>

</section>



<script>

/* =====================================================
   PANTALLAS
===================================================== */

const home =
    document.getElementById("home");

const game =
    document.getElementById("game");

const startButton =
    document.getElementById("startButton");

const backButton =
    document.getElementById("backButton");


startButton.addEventListener(
    "click",
    function() {

        home.style.display = "none";

        game.style.display = "block";

    }
);


backButton.addEventListener(
    "click",
    function() {

        game.style.display = "none";

        home.style.display = "flex";

    }
);


/* =====================================================
   AJEDREZ
===================================================== */

let chess =
    new Chess();

let selectedSquare =
    null;

let computerThinking =
    false;


/* =====================================================
   MARCADOR
===================================================== */

let whiteWins = 0;

let blackWins = 0;

let rounds = 0;


/* =====================================================
   PIEZAS
===================================================== */

const symbols = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"

};


/* =====================================================
   ELEMENTOS
===================================================== */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const modeElement =
    document.getElementById("mode");

const newGameButton =
    document.getElementById("newGame");

const winnerMessage =
    document.getElementById("winnerMessage");

const whiteScore =
    document.getElementById("whiteScore");

const blackScore =
    document.getElementById("blackScore");

const roundCount =
    document.getElementById("roundCount");

const whiteName =
    document.getElementById("whiteName");

const blackName =
    document.getElementById("blackName");


/* =====================================================
   ACTUALIZAR MARCADOR
===================================================== */

function updateScoreboard() {

    whiteScore.textContent =
        whiteWins;

    blackScore.textContent =
        blackWins;

    roundCount.textContent =
        rounds;


    if (
        modeElement.value === "1"
    ) {

        whiteName.textContent =
            "♔ Jugador";

        blackName.textContent =
            "♚ Computadora";

    } else {

        whiteName.textContent =
            "♔ Blancas";

        blackName.textContent =
            "♚ Negras";

    }

}


/* =====================================================
   NUEVA PARTIDA
===================================================== */

function newGame() {

    chess.reset();

    selectedSquare = null;

    computerThinking = false;

    winnerMessage.style.display =
        "none";

    winnerMessage.textContent =
        "";

    drawBoard();

    updateStatus();

    updateScoreboard();

}


/* =====================================================
   DIBUJAR TABLERO
===================================================== */

function drawBoard() {

    boardElement.innerHTML = "";

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement("div");


            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                        ? "light"
                        : "dark"
                );


            const file =
                String.fromCharCode(
                    97 + col
                );

            const rank =
                8 - row;

            const squareName =
                file + rank;


            square.dataset.square =
                squareName;


            if (
                selectedSquare ===
                squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /* MOVIMIENTOS */

            if (selectedSquare) {

                const moves =
                    chess.moves({

                        square:
                            selectedSquare,

                        verbose:
                            true

                    });


                const move =
                    moves.find(
                        m =>
                            m.to ===
                            squareName
                    );


                if (move) {

                    if (move.captured) {

                        square.classList.add(
                            "capture"
                        );

                    } else {

                        square.classList.add(
                            "possible"
                        );

                    }

                }

            }


            /* PIEZA */

            const piece =
                board[row][col];


            if (piece) {

                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );


                element.textContent =
                    symbols[
                        piece.color +
                        piece.type
                    ];


                square.appendChild(
                    element
                );

            }


            square.addEventListener(
                "click",
                function() {

                    handleSquareClick(
                        squareName
                    );

                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    /* JAQUE */

    if (chess.in_check()) {

        const kingSquare =
            findKingSquare(
                chess.turn()
            );


        if (kingSquare) {

            const kingElement =
                document.querySelector(
                    `[data-square="${kingSquare}"]`
                );


            if (kingElement) {

                kingElement.classList.add(
                    "check"
                );

            }

        }

    }

}


/* =====================================================
   ENCONTRAR REY
===================================================== */

function findKingSquare(color) {

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                board[row][col];


            if (
                piece &&
                piece.color === color &&
                piece.type === "k"
            ) {

                return (
                    String.fromCharCode(
                        97 + col
                    ) +
                    (8 - row)
                );

            }

        }

    }


    return null;

}


/* =====================================================
   CLICK EN TABLERO
===================================================== */

function handleSquareClick(square) {

    if (
        chess.game_over()
    ) {

        return;

    }


    if (computerThinking) {

        return;

    }


    if (
        modeElement.value === "1" &&
        chess.turn() === "b"
    ) {

        return;

    }


    const piece =
        chess.get(square);


    /* YA SELECCIONAMOS UNA PIEZA */

    if (selectedSquare) {

        const moves =
            chess.moves({

                square:
                    selectedSquare,

                verbose:
                    true

            });


        const move =
            moves.find(
                m =>
                    m.to === square
            );


        /* MOVIMIENTO VÁLIDO */

        if (move) {

            chess.move({

                from:
                    selectedSquare,

                to:
                    square,

                promotion:
                    "q"

            });


            selectedSquare = null;

            drawBoard();

            updateStatus();


            if (
                !chess.game_over() &&
                modeElement.value === "1" &&
                chess.turn() === "b"
            ) {

                computerThinking = true;

                setTimeout(
                    computerMove,
                    500
                );

            }


            return;

        }


        /* SELECCIONAR OTRA PIEZA */

        if (
            piece &&
            piece.color ===
            chess.turn()
        ) {

            selectedSquare =
                square;

            drawBoard();

            return;

        }


        selectedSquare = null;

        drawBoard();

        return;

    }


    /* SELECCIONAR PIEZA */

    if (
        piece &&
        piece.color ===
        chess.turn()
    ) {

        selectedSquare =
            square;

        drawBoard();

    }

}


/* =====================================================
   COMPUTADORA
===================================================== */

function computerMove() {

    if (
        chess.game_over() ||
        chess.turn() !== "b"
    ) {

        computerThinking = false;

        return;

    }


    const moves =
        chess.moves({
            verbose: true
        });


    if (
        moves.length === 0
    ) {

        computerThinking = false;

        updateStatus();

        return;

    }


    /* PRIORIZAR CAPTURAS */

    const captures =
        moves.filter(
            move =>
                move.captured
        );


    let choices =
        captures.length > 0
            ? captures
            : moves;


    /* PRIORIZAR JAQUES */

    const checks =
        choices.filter(
            move => {

                const test =
                    new Chess(
                        chess.fen()
                    );


                try {

                    test.move({

                        from:
                            move.from,

                        to:
                            move.to,

                        promotion:
                            "q"

                    });


                    return test.in_check();

                } catch {

                    return false;

                }

            }
        );


    if (
        checks.length > 0
    ) {

        choices =
            checks;

    }


    const move =
        choices[
            Math.floor(
                Math.random() *
                choices.length
            )
        ];


    chess.move({

        from:
            move.from,

        to:
            move.to,

        promotion:
            "q"

    });


    computerThinking = false;

    drawBoard();

    updateStatus();

}


/* =====================================================
   FINAL DE PARTIDA
===================================================== */

function finishGame() {

    if (
        !chess.game_over()
    ) {

        return false;

    }


    /*
     * Solo contamos la ronda una vez.
     */

    rounds++;


    if (
        chess.in_checkmate()
    ) {

        /*
         * chess.turn() es el jugador
         * que perdió.
         */

        if (
            chess.turn() === "w"
        ) {

            blackWins++;

            if (
                modeElement.value === "1"
            ) {

                winnerMessage.textContent =
                    "🏆 ¡La computadora ganó la ronda!";

            } else {

                winnerMessage.textContent =
                    "🏆 ¡Las negras ganaron la ronda!";

            }

        } else {

            whiteWins++;

            winnerMessage.textContent =
                "🏆 ¡Las blancas ganaron la ronda!";

        }


        winnerMessage.style.display =
            "block";


        updateScoreboard();

        return true;

    }


    /*
     * Tablas
     */

    if (
        chess.in_stalemate() ||
        chess.isThreefoldRepetition() ||
        chess.insufficient_material() ||
        chess.in_draw()
    ) {

        winnerMessage.textContent =
            "🤝 ¡La ronda terminó en tablas!";

        winnerMessage.style.display =
            "block";


        updateScoreboard();

        return true;

    }


    return false;

}


/* =====================================================
   ESTADO
===================================================== */

function updateStatus() {

    if (
        chess.in_checkmate()
    ) {

        const winner =
            chess.turn() === "w"
                ? "negras"
                : "blancas";


        statusElement.textContent =
            "🏆 ¡Jaque mate!";


        finishGame();

        return;

    }


    if (
        chess.in_stalemate()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por ahogado!";

        finishGame();

        return;

    }


    if (
        chess.isThreefoldRepetition()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por repetición!";

        finishGame();

        return;

    }


    if (
        chess.insufficient_material()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas!";

        finishGame();

        return;

    }


    const turnText =
        chess.turn() === "w"
            ? "Blancas"
            : "Negras";


    if (
        chess.in_check()
    ) {

        statusElement.textContent =
            "⚠️ ¡Jaque! Turno: " +
            turnText;

    } else {

        statusElement.textContent =
            "Turno: " +
            turnText;

    }

}


/* =====================================================
   CAMBIAR MODO
===================================================== */

modeElement.addEventListener(
    "change",
    function() {

        /*
         * Cambiamos de modo y empezamos
         * un marcador nuevo.
         */

        whiteWins = 0;

        blackWins = 0;

        rounds = 0;

        newGame();

    }
);


/* =====================================================
   NUEVA PARTIDA
===================================================== */

newGameButton.addEventListener(
    "click",
    function() {

        newGame();

    }
);


/* =====================================================
   INICIO
===================================================== */

newGame();

</script>

</body>
</html>
