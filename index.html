<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: white;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .container {
        width: 100%;
        max-width: 650px;
        text-align: center;
    }

    h1 {
        margin-top: 0;
        font-size: 34px;
    }

    .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 12px;
    }

    select,
    button {
        padding: 8px 12px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
    }

    button {
        background: #2563eb;
        color: white;
    }

    button:hover {
        background: #1d4ed8;
    }

    #status {
        margin: 8px auto 12px;
        font-size: 17px;
        font-weight: bold;
    }

    /* TABLERO MÁS PEQUEÑO */
    .board {
        width: min(70vw, 520px);
        height: min(70vw, 520px);
        margin: auto;
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        border: 4px solid #111;
        box-shadow: 0 10px 30px rgba(0,0,0,.5);
    }

    .square {
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;

        /* PIEZAS MÁS PEQUEÑAS */
        font-size: clamp(24px, 5vw, 48px);

        cursor: pointer;
        user-select: none;
    }

    .light {
        background: #f0d9b5;
    }

    .dark {
        background: #b58863;
    }

    .selected {
        box-shadow: inset 0 0 0 4px #22c55e;
    }

    .possible::after {
        content: "";
        width: 22%;
        height: 22%;
        border-radius: 50%;
        background: rgba(0,0,0,.3);
        position: absolute;
    }

    .capture {
        box-shadow: inset 0 0 0 4px #ef4444;
    }

    .piece {
        position: relative;
        z-index: 2;
        text-shadow: 1px 2px 2px rgba(0,0,0,.5);
    }

    .white-piece {
        color: #fff;
    }

    .black-piece {
        color: #111;
    }

    .info {
        margin-top: 12px;
        color: #d1d5db;
        font-size: 13px;
    }

    @media (max-width: 500px) {

        h1 {
            font-size: 27px;
        }

        .board {
            width: 88vw;
            height: 88vw;
        }

        .square {
            font-size: 10vw;
        }
    }
</style>
