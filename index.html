<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajedrez</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =====================================================
   CONFIGURACIÓN GENERAL
===================================================== */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    font-family: Arial, sans-serif;
}


/* =====================================================
   PANTALLA DE INICIO
===================================================== */

#home {

    width: 100%;
    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            #ff6b6b,
            transparent 25%
        ),
        radial-gradient(
            circle at 85% 20%,
            #4dabf7,
            transparent 25%
        ),
        radial-gradient(
            circle at 50% 100%,
            #845ef7,
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #667eea,
            #764ba2
        );
}

.home-card {

    width: min(90%, 560px);

    padding: 45px 30px;

    text-align: center;

    border-radius: 28px;

    background: rgba(255,255,255,.95);

    box-shadow:
        0 20px 60px rgba(0,0,0,.3);

    position: relative;

    z-index: 2;
}

.logo {

    font-size: 80px;

    margin-bottom: 5px;
}

.title {

    margin: 0;

    font-size: 58px;

    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #9c27b0,
            #ea4335,
            #fbbc05
        );

    -webkit-background-clip: text;

    color: transparent;
}

.subtitle {

    color: #5f6368;

    font-size: 19px;

    margin: 12px 0 30px;
}

.start-button {

    border: none;

    border-radius: 30px;

    padding: 15px 45px;

    font-size: 18px;

    font-weight: bold;

    color: white;

    cursor: pointer;

    background:
        linear-gradient(
            90deg,
            #4285f4,
            #8e44ad
        );

    box-shadow:
        0 7px 20px rgba(0,0,0,.2);

    transition: .2s;
}

.start-button:hover {

    transform:
        translateY(-3px)
        scale(1.04);
}


/* =====================================================
   PIEZAS DECORATIVAS DEL INICIO
===================================================== */

.floating {

    position: absolute;

    color: white;

    opacity: .15;

    font-size: 100px;

    animation:
        float 5s infinite
        ease-in-out;
}

.f1 {
    left: 8%;
    top: 15%;
}

.f2 {

    right: 8%;
    top: 18%;

    animation-delay: 1s;
}

.f3 {

    left: 12%;
    bottom: 10%;

    animation-delay: 2s;
}

.f4 {

    right: 12%;
    bottom: 12%;

    animation-delay: 3s;
}

@keyframes float {

    0%,100% {

        transform:
            translateY(0)
            rotate(-5deg);
    }

    50% {

        transform:
            translateY(-20px)
            rotate(5deg);
    }
}


/* =====================================================
   JUEGO
===================================================== */

#game {

    display: none;

    width: 100%;
    height: 100vh;

    overflow: hidden;

    padding:
        8px 15px;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,220,160,.2),
            transparent 30%
        ),
        linear-gradient(
            180deg,
            #33485c,
            #172333 60%,
            #101722
        );

    color: white;
}

.game-container {

    width: 100%;
    height: 100%;

    max-width: 1050px;

    margin: auto;

    display: flex;

    flex-direction: column;
}


/* =====================================================
   CABECERA
===================================================== */

.game-header {

    height: 45px;

    flex-shrink: 0;

    display: flex;

    justify-content: space-between;

    align-items: center;
}

.game-title {

    margin: 0;

    font-size: 27px;

    text-shadow:
        0 2px 5px black;
}

.back-button {

    border:
        1px solid
        rgba(255,255,255,.3);

    background:
        rgba(255,255,255,.12);

    color: white;

    padding:
        7px 13px;

    border-radius: 7px;

    cursor: pointer;
}

.back-button:hover {

    background:
        rgba(255,255,255,.25);
}


/* =====================================================
   ZONA PRINCIPAL
===================================================== */

.game-area {

    flex: 1;

    min-height: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    gap: 25px;
}


/* =====================================================
   MARCADOR
===================================================== */

.scoreboard {

    width: 140px;

    flex-shrink: 0;

    display: flex;

    flex-direction: column;

    gap: 12px;
}

.score-card {

    background: white;

    color: #202124;

    border-radius: 14px;

    padding:
        14px 10px;

    text-align: center;

    box-shadow:
        0 7px 18px
        rgba(0,0,0,.35);
}

.score-name {

    font-size: 14px;

    color: #5f6368;

    margin-bottom: 5px;
}

.score {

    font-size: 32px;

    font-weight: bold;
}

.rounds {

    text-align: center;

    font-size: 13px;

    color: #e5e7eb;
}


/* =====================================================
   SECCIÓN DEL TABLERO
===================================================== */

.board-section {

    position: relative;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;
}


/* =====================================================
   CONTROLES A LA DERECHA
===================================================== */

.controls {

    position: absolute;

    left: calc(100% + 22px);

    top: 50%;

    transform:
        translateY(-50%);

    width: 175px;

    display: flex;

    flex-direction: column;

    align-items: stretch;

    gap: 8px;

    margin: 0;

    padding: 15px;

    background:
        rgba(255,255,255,.10);

    border:
        1px solid
        rgba(255,255,255,.2);

    border-radius: 12px;

    backdrop-filter:
        blur(5px);

    box-shadow:
        0 8px 20px
        rgba(0,0,0,.25);

    z-index: 10;
}

.controls label {

    text-align: center;

    font-size: 14px;
}

.controls select,
.controls .new-game-button {

    width: 100%;
}

select,
.new-game-button {

    border: none;

    padding:
        8px 11px;

    border-radius: 6px;

    font-size: 13px;

    cursor: pointer;
}

.new-game-button {

    background:
        #1a73e8;

    color: white;
}

.new-game-button:hover {

    background:
        #1765c1;
}


/* =====================================================
   ESTADO DE LA PARTIDA
===================================================== */

#status {

    min-height: 22px;

    margin:
        2px 0 4px;

    font-size: 16px;

    font-weight: bold;

    text-shadow:
        0 2px 4px black;
}


/* =====================================================
   SILLAS
===================================================== */

.chair {

    width: 145px;

    height: 40px;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    margin:
        -1px 0;
}


/* =====================================================
   RESPALDO DE LA SILLA
===================================================== */

.chair-back {

    position: absolute;

    width: 100px;

    height: 32px;

    left: 22px;

    top: 0;

    border-radius:
        15px 15px
        7px 7px;

    background:
        linear-gradient(
            90deg,
            #5b351b,
            #8b5428,
            #4d2b15
        );

    border:
        4px solid
        #3e210f;

    box-shadow:
        inset 0 2px 3px
        rgba(255,255,255,.15),

        0 3px 6px
        rgba(0,0,0,.4);
}


/* =====================================================
   ASIENTO
===================================================== */

.chair-seat {

    width: 125px;

    height: 20px;

    border-radius: 8px;

    background:
        linear-gradient(
            90deg,
            #4d2b15,
            #7b4722,
            #4d2b15
        );

    border:
        4px solid
        #3e210f;

    position: relative;

    z-index: 2;

    box-shadow:
        0 3px 6px
        rgba(0,0,0,.4);
}


/* =====================================================
   PATAS DE LAS SILLAS
===================================================== */

.chair-legs {

    position: absolute;

    bottom: -6px;

    width: 105px;

    display: flex;

    justify-content: space-between;
}

.chair-leg {

    width: 9px;

    height: 15px;

    background:
        #3e210f;

    border-radius: 2px;
}


/* =====================================================
   SILLA SUPERIOR
===================================================== */

.chair.top {

    transform:
        rotate(180deg);
}


/* =====================================================
   MESA
===================================================== */

.table {

    padding: 22px;

    border-radius: 17px;

    background:
        repeating-linear-gradient(
            90deg,
            #5d351a 0px,
            #70421f 35px,
            #4d2b15 70px,
            #6a3b1b 105px
        );

    border:
        7px solid
        #3e210f;

    box-shadow:
        0 20px 35px
        rgba(0,0,0,.6),

        inset 0 3px 6px
        rgba(255,255,255,.12),

        inset 0 -5px 12px
        rgba(0,0,0,.4);
}


/* =====================================================
   TABLERO
===================================================== */

.board {

    width:
        min(480px, 58vh);

    height:
        min(480px, 58vh);

    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    grid-template-rows:
        repeat(8, 1fr);

    border:
        4px solid
        #211208;

    box-shadow:
        0 8px 18px
        rgba(0,0,0,.55);
}


/* =====================================================
   CASILLAS
===================================================== */

.square {

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    user-select: none;
}

.light {

    background:
        #f0d9b5;
}

.dark {

    background:
        #b58863;
}


/* =====================================================
   PIEZAS
===================================================== */

.piece {

    font-size:
        min(42px, 5.1vh);

    line-height: 1;

    pointer-events: none;

    z-index: 2;

    text-shadow:
        1px 2px 2px
        rgba(0,0,0,.5);
}

.white-piece {

    color: white;
}

.black-piece {

    color: #111;
}


/* =====================================================
   MOVIMIENTOS
===================================================== */

.selected {

    box-shadow:
        inset 0 0 0 4px
        #34a853;
}

.possible::after {

    content: "";

    position: absolute;

    width: 14px;

    height: 14px;

    border-radius: 50%;

    background:
        rgba(0,0,0,.3);
}

.capture {

    box-shadow:
        inset 0 0 0 4px
        #ea4335;
}

.check {

    box-shadow:
        inset 0 0 0 5px
        #ea4335;
}


/* =====================================================
   MENSAJE GANADOR
===================================================== */

#winnerMessage {

    display: none;

    margin:
        5px auto;

    padding:
        9px 16px;

    border-radius: 10px;

    background:
        #ffe69c;

    color:
        #664d03;

    font-weight: bold;

    box-shadow:
        0 3px 10px
        rgba(0,0,0,.3);
}

.info {

    margin-top: 5px;

    color:
        rgba(255,255,255,.7);

    font-size: 12px;
}


/* =====================================================
   PANTALLAS PEQUEÑAS
===================================================== */

@media (max-width: 800px) {

    #game {

        overflow-y: auto;
    }

    .game-area {

        flex-direction: column;

        justify-content:
            flex-start;

        padding-top: 5px;
    }

    .scoreboard {

        width: auto;

        flex-direction: row;

        order: 2;
    }

    .board {

        width:
            min(82vw, 480px);

        height:
            min(82vw, 480px);
    }

    .piece {

        font-size: 9vw;
    }

    .chair {

        display: none;
    }

    /* En móvil los controles vuelven
       a colocarse debajo del tablero */

    .controls {

        position: static;

        transform: none;

        width: auto;

        flex-direction: row;

        background: transparent;

        border: none;

        box-shadow: none;

        padding: 0;

        margin-bottom: 5px;
    }

    .controls select,
    .controls .new-game-button {

        width: auto;
    }
}

</style>
</head>

<body>


<!-- =====================================================
     PANTALLA DE INICIO
===================================================== -->

<section id="home">

    <div class="floating f1">
        ♟
    </div>

    <div class="floating f2">
        ♞
    </div>

    <div class="floating f3">
        ♜
    </div>

    <div class="floating f4">
        ♛
    </div>


    <div class="home-card">

        <div class="logo">
            ♟
        </div>

        <h1 class="title">
            Ajedrez
        </h1>

        <div class="subtitle">
            ¡Pon a prueba tu estrategia!
        </div>

        <button
            class="start-button"
            id="startButton"
        >
            ♟ Comenzar partida
        </button>

    </div>

</section>



<!-- =====================================================
     JUEGO
===================================================== -->

<section id="game">

    <div class="game-container">


        <!-- CABECERA -->

        <div class="game-header">

            <h1 class="game-title">
                ♟ Ajedrez
            </h1>

            <button
                class="back-button"
                id="backButton"
            >
                ← Inicio
            </button>

        </div>



        <!-- ZONA DE JUEGO -->

        <div class="game-area">


            <!-- MARCADOR -->

            <div class="scoreboard">

                <div class="score-card">

                    <div
                        class="score-name"
                        id="whiteName"
                    >
                        ♔ Blancas
                    </div>

                    <div
                        class="score"
                        id="whiteScore"
                    >
                        0
                    </div>

                </div>


                <div class="score-card">

                    <div
                        class="score-name"
                        id="blackName"
                    >
                        ♚ Negras
                    </div>

                    <div
                        class="score"
                        id="blackScore"
                    >
                        0
                    </div>

                </div>


                <div class="rounds">

                    Rondas jugadas:

                    <strong id="roundCount">
                        0
                    </strong>

                </div>

            </div>



            <!-- SECCIÓN DEL TABLERO -->

            <div class="board-section">


                <!-- SILLA DE ARRIBA -->

                <div class="chair top">

                    <div class="chair-back"></div>

                    <div class="chair-seat"></div>

                    <div class="chair-legs">

                        <div class="chair-leg"></div>

                        <div class="chair-leg"></div>

                    </div>

                </div>



                <!-- CONTROLES -->

                <div class="controls">

                    <label>
                        Modo de juego
                    </label>

                    <select id="mode">

                        <option value="2">
                            👥 2 jugadores
                        </option>

                        <option value="1">
                            🤖 1 jugador vs computadora
                        </option>

                    </select>


                    <button
                        class="new-game-button"
                        id="newGame"
                    >
                        ♟ Nueva partida
                    </button>

                </div>



                <!-- ESTADO -->

                <div id="status">
                    Turno: Blancas
                </div>


                <!-- GANADOR -->

                <div id="winnerMessage"></div>



                <!-- MESA -->

                <div class="table">

                    <div
                        id="board"
                        class="board"
                    ></div>

                </div>



                <!-- SILLA DE ABAJO -->

                <div class="chair bottom">

                    <div class="chair-back"></div>

                    <div class="chair-seat"></div>

                    <div class="chair-legs">

                        <div class="chair-leg"></div>

                        <div class="chair-leg"></div>

                    </div>

                </div>



                <div class="info">

                    Haz clic en una pieza y después
                    en la casilla donde quieres moverla.

                </div>

            </div>

        </div>

    </div>

</section>



<script>

/* =====================================================
   CAMBIO DE PANTALLAS
===================================================== */

const home =
    document.getElementById("home");

const game =
    document.getElementById("game");


document
    .getElementById("startButton")
    .addEventListener(
        "click",
        () => {

            home.style.display =
                "none";

            game.style.display =
                "block";

        }
    );


document
    .getElementById("backButton")
    .addEventListener(
        "click",
        () => {

            game.style.display =
                "none";

            home.style.display =
                "flex";

        }
    );


/* =====================================================
   VARIABLES DEL AJEDREZ
===================================================== */

let chess =
    new Chess();

let selectedSquare =
    null;

let computerThinking =
    false;

let whiteWins =
    0;

let blackWins =
    0;

let rounds =
    0;

let gameCounted =
    false;


/* =====================================================
   SÍMBOLOS DE LAS PIEZAS
===================================================== */

const symbols = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"

};


/* =====================================================
   ELEMENTOS
===================================================== */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const modeElement =
    document.getElementById("mode");

const winnerMessage =
    document.getElementById("winnerMessage");

const whiteScore =
    document.getElementById("whiteScore");

const blackScore =
    document.getElementById("blackScore");

const roundCount =
    document.getElementById("roundCount");

const whiteName =
    document.getElementById("whiteName");

const blackName =
    document.getElementById("blackName");


/* =====================================================
   ACTUALIZAR MARCADOR
===================================================== */

function updateScoreboard() {

    whiteScore.textContent =
        whiteWins;

    blackScore.textContent =
        blackWins;

    roundCount.textContent =
        rounds;


    if (
        modeElement.value === "1"
    ) {

        whiteName.textContent =
            "♔ Jugador";

        blackName.textContent =
            "♚ Computadora";

    } else {

        whiteName.textContent =
            "♔ Blancas";

        blackName.textContent =
            "♚ Negras";

    }

}


/* =====================================================
   NUEVA PARTIDA
===================================================== */

function newGame() {

    chess.reset();

    selectedSquare =
        null;

    computerThinking =
        false;

    gameCounted =
        false;

    winnerMessage.style.display =
        "none";

    winnerMessage.textContent =
        "";

    drawBoard();

    updateStatus();

    updateScoreboard();

}


/* =====================================================
   DIBUJAR TABLERO
===================================================== */

function drawBoard() {

    boardElement.innerHTML =
        "";

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement(
                    "div"
                );


            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                        ? "light"
                        : "dark"
                );


            const file =
                String.fromCharCode(
                    97 + col
                );

            const rank =
                8 - row;

            const squareName =
                file + rank;


            square.dataset.square =
                squareName;


            /* CASILLA SELECCIONADA */

            if (
                selectedSquare ===
                squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /* MOVIMIENTOS POSIBLES */

            if (selectedSquare) {

                const moves =
                    chess.moves({

                        square:
                            selectedSquare,

                        verbose:
                            true

                    });


                const move =
                    moves.find(
                        m =>
                            m.to ===
                            squareName
                    );


                if (move) {

                    if (
                        move.captured
                    ) {

                        square.classList.add(
                            "capture"
                        );

                    } else {

                        square.classList.add(
                            "possible"
                        );

                    }

                }

            }


            /* PIEZA */

            const piece =
                board[row][col];


            if (piece) {

                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );


                element.textContent =
                    symbols[
                        piece.color +
                        piece.type
                    ];


                square.appendChild(
                    element
                );

            }


            /* CLICK */

            square.addEventListener(
                "click",
                () =>
                    handleSquareClick(
                        squareName
                    )
            );


            boardElement.appendChild(
                square
            );

        }

    }


    /* REY EN JAQUE */

    if (
        chess.in_check()
    ) {

        const kingSquare =
            findKingSquare(
                chess.turn()
            );


        if (kingSquare) {

            const king =
                document.querySelector(
                    `[data-square="${kingSquare}"]`
                );


            if (king) {

                king.classList.add(
                    "check"
                );

            }

        }

    }

}


/* =====================================================
   BUSCAR REY
===================================================== */

function findKingSquare(color) {

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                board[row][col];


            if (
                piece &&
                piece.color === color &&
                piece.type === "k"
            ) {

                return (
                    String.fromCharCode(
                        97 + col
                    ) +
                    (8 - row)
                );

            }

        }

    }


    return null;

}


/* =====================================================
   CLIC EN UNA CASILLA
===================================================== */

function handleSquareClick(square) {

    /* PARTIDA TERMINADA */

    if (
        chess.game_over()
    ) {

        return;

    }


    /* COMPUTADORA PENSANDO */

    if (
        computerThinking
    ) {

        return;

    }


    /* EL JUGADOR NO PUEDE MOVER
       LAS NEGRAS CONTRA LA COMPUTADORA */

    if (
        modeElement.value === "1" &&
        chess.turn() === "b"
    ) {

        return;

    }


    const piece =
        chess.get(square);


    /* SI YA HAY UNA PIEZA SELECCIONADA */

    if (selectedSquare) {

        const moves =
            chess.moves({

                square:
                    selectedSquare,

                verbose:
                    true

            });


        const move =
            moves.find(
                m =>
                    m.to === square
            );


        /* MOVIMIENTO VÁLIDO */

        if (move) {

            chess.move({

                from:
                    selectedSquare,

                to:
                    square,

                promotion:
                    "q"

            });


            selectedSquare =
                null;

            drawBoard();

            updateStatus();


            /* TURNO DE LA COMPUTADORA */

            if (
                !chess.game_over() &&
                modeElement.value === "1" &&
                chess.turn() === "b"
            ) {

                computerThinking =
                    true;

                setTimeout(
                    computerMove,
                    500
                );

            }


            return;

        }


        /* SELECCIONAR OTRA PIEZA */

        if (
            piece &&
            piece.color ===
            chess.turn()
        ) {

            selectedSquare =
                square;

            drawBoard();

            return;

        }


        /* QUITAR SELECCIÓN */

        selectedSquare =
            null;

        drawBoard();

        return;

    }


    /* SELECCIONAR PIEZA */

    if (
        piece &&
        piece.color ===
        chess.turn()
    ) {

        selectedSquare =
            square;

        drawBoard();

    }

}


/* =====================================================
   MOVIMIENTO DE LA COMPUTADORA
===================================================== */

function computerMove() {

    if (
        chess.game_over() ||
        chess.turn() !== "b"
    ) {

        computerThinking =
            false;

        return;

    }


    const moves =
        chess.moves({

            verbose:
                true

        });


    if (
        !moves.length
    ) {

        computerThinking =
            false;

        return;

    }


    /* PREFERIR CAPTURAS */

    const captures =
        moves.filter(
            move =>
                move.captured
        );


    const choices =
        captures.length
            ? captures
            : moves;


    const move =
        choices[
            Math.floor(
                Math.random() *
                choices.length
            )
        ];


    chess.move({

        from:
            move.from,

        to:
            move.to,

        promotion:
            "q"

    });


    computerThinking =
        false;

    drawBoard();

    updateStatus();

}


/* =====================================================
   TERMINAR PARTIDA
===================================================== */

function finishGame() {

    if (
        !chess.game_over() ||
        gameCounted
    ) {

        return;

    }


    gameCounted =
        true;

    rounds++;


    /* JAQUE MATE */

    if (
        chess.in_checkmate()
    ) {

        if (
            chess.turn() === "w"
        ) {

            blackWins++;


            winnerMessage.textContent =
                modeElement.value === "1"
                    ? "🏆 ¡La computadora ganó!"
                    : "🏆 ¡Las negras ganaron!";

        } else {

            whiteWins++;


            winnerMessage.textContent =
                "🏆 ¡Las blancas ganaron!";

        }

    } else {

        /* TABLAS */

        winnerMessage.textContent =
            "🤝 ¡La partida terminó en tablas!";

    }


    winnerMessage.style.display =
        "block";


    updateScoreboard();

}


/* =====================================================
   ACTUALIZAR ESTADO
===================================================== */

function updateStatus() {

    /* JAQUE MATE */

    if (
        chess.in_checkmate()
    ) {

        statusElement.textContent =
            "🏆 ¡JAQUE MATE!";

        finishGame();

        return;

    }


    /* TABLAS */

    if (
        chess.is_stalemate() ||
        chess.isThreefoldRepetition() ||
        chess.insufficient_material() ||
        chess.in_draw()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas!";

        finishGame();

        return;

    }


    const turn =
        chess.turn() === "w"
            ? "Blancas"
            : "Negras";


    /* JAQUE */

    if (
        chess.in_check()
    ) {

        statusElement.textContent =
            "⚠️ ¡Jaque! Turno: " +
            turn;

    } else {

        statusElement.textContent =
            "Turno: " +
            turn;

    }

}


/* =====================================================
   BOTÓN NUEVA PARTIDA
===================================================== */

document
    .getElementById("newGame")
    .addEventListener(
        "click",
        newGame
    );


/* =====================================================
   CAMBIO DE MODO
===================================================== */

modeElement.addEventListener(
    "change",
    () => {

        whiteWins =
            0;

        blackWins =
            0;

        rounds =
            0;

        newGame();

    }
);


/* =====================================================
   INICIAR
===================================================== */

newGame();

</script>
