<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajedrez</title>

<!-- Motor de ajedrez -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #111827,
            #1f2937
        );

    color: white;

    display: flex;
    justify-content: center;
    align-items: center;

    padding: 15px;
}

.container {
    width: 100%;
    max-width: 600px;

    text-align: center;
}

h1 {
    margin: 0 0 12px;

    font-size: 32px;
}

.controls {
    display: flex;
    justify-content: center;
    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 8px;
}

select,
button {
    border: none;
    border-radius: 7px;

    padding: 8px 12px;

    font-size: 14px;
}

select {
    background: white;
    color: #111;
}

button {
    background: #2563eb;
    color: white;

    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#status {
    min-height: 24px;

    margin-bottom: 8px;

    font-size: 17px;

    font-weight: bold;
}

/* =========================
   TABLERO
========================= */

.board {
    width: 480px;
    height: 480px;

    max-width: 90vw;
    max-height: 90vw;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);

    border: 5px solid #111;

    box-shadow:
        0 12px 35px rgba(0,0,0,.55);
}

/* CASILLAS */

.square {
    position: relative;

    display: flex;

    justify-content: center;
    align-items: center;

    cursor: pointer;

    user-select: none;
}

.light {
    background: #f0d9b5;
}

.dark {
    background: #b58863;
}

/* =========================
   PIEZAS
========================= */

.piece {
    font-size: 42px;

    line-height: 1;

    z-index: 2;

    pointer-events: none;

    text-shadow:
        1px 2px 2px rgba(0,0,0,.5);
}

.white-piece {
    color: white;
}

.black-piece {
    color: #111;
}

/* PIEZA SELECCIONADA */

.selected {
    box-shadow:
        inset 0 0 0 4px #22c55e;
}

/* MOVIMIENTO POSIBLE */

.possible::after {
    content: "";

    position: absolute;

    width: 15px;
    height: 15px;

    border-radius: 50%;

    background: rgba(0,0,0,.35);
}

/* CAPTURA */

.capture {
    box-shadow:
        inset 0 0 0 4px #ef4444;
}

/* JAQUE */

.check {
    box-shadow:
        inset 0 0 0 5px #ef4444;
}

.info {
    margin-top: 10px;

    color: #d1d5db;

    font-size: 13px;
}

/* =========================
   MÓVIL
========================= */

@media (max-width: 550px) {

    .board {
        width: 90vw;
        height: 90vw;
    }

    .piece {
        font-size: 9.5vw;
    }

    h1 {
        font-size: 27px;
    }
}

</style>
</head>

<body>

<div class="container">

    <h1>♟️ Ajedrez</h1>

    <div class="controls">

        <label>
            Modo:
        </label>

        <select id="mode">

            <option value="2">
                2 jugadores
            </option>

            <option value="1">
                1 jugador vs computadora
            </option>

        </select>

        <button id="newGame">
            Nueva partida
        </button>

    </div>

    <div id="status">
        Turno: Blancas
    </div>

    <div id="board" class="board"></div>

    <div class="info">
        Haz clic en una pieza y después en la casilla donde quieres moverla.
    </div>

</div>


<script>

/* =====================================
   MOTOR DE AJEDREZ
===================================== */

let chess = new Chess();

let selectedSquare = null;

let computerThinking = false;


/* =====================================
   PIEZAS
===================================== */

const symbols = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"

};


/* =====================================
   ELEMENTOS
===================================== */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const modeElement =
    document.getElementById("mode");

const newGameButton =
    document.getElementById("newGame");


/* =====================================
   NUEVA PARTIDA
===================================== */

function newGame() {

    chess.reset();

    selectedSquare = null;

    computerThinking = false;

    drawBoard();

    updateStatus();

}


/* =====================================
   DIBUJAR TABLERO
===================================== */

function drawBoard() {

    boardElement.innerHTML = "";


    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement("div");


            const isLight =
                (row + col) % 2 === 0;


            square.className =
                "square " +
                (
                    isLight
                        ? "light"
                        : "dark"
                );


            /*
             * Convertir coordenadas
             *
             * row 0 = 8
             * row 7 = 1
             */

            const file =
                String.fromCharCode(
                    97 + col
                );

            const rank =
                8 - row;

            const squareName =
                file + rank;


            square.dataset.square =
                squareName;


            /* PIEZA SELECCIONADA */

            if (
                selectedSquare ===
                squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /* MOVIMIENTOS */

            if (selectedSquare) {

                const moves =
                    chess.moves({
                        square:
                            selectedSquare,

                        verbose: true
                    });


                const move =
                    moves.find(
                        m =>
                            m.to ===
                            squareName
                    );


                if (move) {

                    if (move.captured) {

                        square.classList.add(
                            "capture"
                        );

                    } else {

                        square.classList.add(
                            "possible"
                        );

                    }

                }

            }


            /* PIEZA */

            const piece =
                board[row][col];


            if (piece) {

                const key =
                    piece.color +
                    piece.type;


                const pieceElement =
                    document.createElement(
                        "span"
                    );


                pieceElement.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );


                pieceElement.textContent =
                    symbols[key];


                square.appendChild(
                    pieceElement
                );

            }


            /*
             * Click
             */

            square.addEventListener(
                "click",
                () => {

                    handleSquareClick(
                        squareName
                    );

                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    /* MARCAR REY EN JAQUE */

    if (chess.in_check()) {

        const currentColor =
            chess.turn();


        const kingSquare =
            findKingSquare(
                currentColor
            );


        if (kingSquare) {

            const kingElement =
                document.querySelector(
                    `[data-square="${kingSquare}"]`
                );


            if (kingElement) {

                kingElement.classList.add(
                    "check"
                );

            }

        }

    }

}


/* =====================================
   ENCONTRAR REY
===================================== */

function findKingSquare(color) {

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                board[row][col];


            if (
                piece &&
                piece.color === color &&
                piece.type === "k"
            ) {

                const file =
                    String.fromCharCode(
                        97 + col
                    );

                const rank =
                    8 - row;


                return file + rank;

            }

        }

    }


    return null;

}


/* =====================================
   CLICK EN CASILLA
===================================== */

function handleSquareClick(
    square
) {

    if (
        chess.game_over()
    ) {
        return;
    }


    if (computerThinking) {
        return;
    }


    /*
     * En modo computadora,
     * las negras pertenecen a la IA.
     */

    if (
        modeElement.value === "1" &&
        chess.turn() === "b"
    ) {
        return;
    }


    const piece =
        chess.get(square);


    /* ================================
       YA HAY PIEZA SELECCIONADA
    ================================= */

    if (selectedSquare) {

        const moves =
            chess.moves({
                square:
                    selectedSquare,

                verbose: true
            });


        const move =
            moves.find(
                m =>
                    m.to === square
            );


        /*
         * MOVIMIENTO VÁLIDO
         */

        if (move) {

            /*
             * Promoción automática a dama.
             */

            chess.move({

                from:
                    selectedSquare,

                to:
                    square,

                promotion:
                    "q"

            });


            selectedSquare = null;


            drawBoard();

            updateStatus();


            /*
             * Computadora
             */

            if (
                !chess.game_over() &&
                modeElement.value === "1" &&
                chess.turn() === "b"
            ) {

                computerThinking = true;


                setTimeout(
                    computerMove,
                    500
                );

            }


            return;

        }


        /*
         * Si hizo click en otra
         * pieza de su color
         */

        if (
            piece &&
            piece.color ===
            chess.turn()
        ) {

            selectedSquare =
                square;

            drawBoard();

            return;

        }


        /*
         * Quitar selección
         */

        selectedSquare = null;

        drawBoard();

        return;

    }


    /* ================================
       SELECCIONAR PIEZA
    ================================= */

    if (
        piece &&
        piece.color ===
        chess.turn()
    ) {

        selectedSquare =
            square;

        drawBoard();

    }

}


/* =====================================
   COMPUTADORA
===================================== */

function computerMove() {

    if (
        chess.game_over() ||
        chess.turn() !== "b"
    ) {

        computerThinking = false;

        return;
    }


    const moves =
        chess.moves({
            verbose: true
        });


    if (
        moves.length === 0
    ) {

        computerThinking = false;

        updateStatus();

        return;

    }


    /*
     * Buscar capturas primero.
     *
     * Esto hace que la computadora
     * intente "comerse" piezas.
     */

    const captures =
        moves.filter(
            move =>
                move.captured
        );


    let possibleMoves =
        captures.length > 0
            ? captures
            : moves;


    /*
     * Si puede dar jaque,
     * darle prioridad.
     */

    const checkingMoves =
        possibleMoves.filter(
            move => {

                const copy =
                    new Chess(
                        chess.fen()
                    );


                try {

                    copy.move({
                        from: move.from,
                        to: move.to,
                        promotion: "q"
                    });

                    return copy.in_check();

                } catch {

                    return false;

                }

            }
        );


    if (
        checkingMoves.length > 0
    ) {

        possibleMoves =
            checkingMoves;

    }


    /*
     * Elegir movimiento
     */

    const move =
        possibleMoves[
            Math.floor(
                Math.random() *
                possibleMoves.length
            )
        ];


    /*
     * Hacer movimiento
     */

    chess.move({

        from:
            move.from,

        to:
            move.to,

        promotion:
            "q"

    });


    computerThinking = false;

    drawBoard();

    updateStatus();

}


/* =====================================
   ESTADO
===================================== */

function updateStatus() {

    if (
        chess.in_checkmate()
    ) {

        const winner =
            chess.turn() === "w"
                ? "negras"
                : "blancas";


        statusElement.textContent =
            "🏆 ¡Jaque mate! Ganan las " +
            winner +
            ".";


        return;

    }


    if (
        chess.in_stalemate()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por ahogado!";


        return;

    }


    if (
        chess.isThreefoldRepetition()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por repetición!";


        return;

    }


    if (
        chess.insufficient_material()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas! Material insuficiente.";


        return;

    }


    const turnText =
        chess.turn() === "w"
            ? "Blancas"
            : "Negras";


    if (
        chess.in_check()
    ) {

        statusElement.textContent =
            "⚠️ ¡Jaque! Turno: " +
            turnText;

    } else {

        statusElement.textContent =
            "Turno: " +
            turnText;

    }

}


/* =====================================
   EVENTOS
===================================== */

newGameButton.addEventListener(
    "click",
    newGame
);


modeElement.addEventListener(
    "change",
    newGame
);


/* =====================================
   INICIAR
===================================== */

newGame();

</script>

</body>
</html>
