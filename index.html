<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ajedrez</title>

<!-- Motor de ajedrez -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>

/* =========================================
   GENERAL
========================================= */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Arial, Helvetica, sans-serif;

    background: white;

    color: #202124;
}


/* =========================================
   PANTALLA DE INICIO
========================================= */

#home {
    min-height: 100vh;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    padding: 20px;
}


.logo {
    font-size: 80px;

    margin-bottom: 10px;

    color: #202124;

    font-weight: 500;
}


.title {
    font-size: 52px;

    font-weight: 400;

    margin: 0 0 12px;

    color: #202124;
}


.subtitle {
    font-size: 18px;

    color: #5f6368;

    margin-bottom: 30px;
}


/* BOTÓN INICIO */

.start-button {
    border: none;

    background: #1a73e8;

    color: white;

    padding: 12px 30px;

    border-radius: 6px;

    font-size: 17px;

    cursor: pointer;

    box-shadow:
        0 1px 3px rgba(0,0,0,.2);

    transition: .2s;
}


.start-button:hover {
    background: #1765c1;

    box-shadow:
        0 2px 6px rgba(0,0,0,.25);
}


/* =========================================
   JUEGO
========================================= */

#game {
    display: none;

    min-height: 100vh;

    background: #f8f9fa;

    padding: 25px 15px 40px;
}


.game-container {
    width: 100%;

    max-width: 650px;

    margin: auto;

    text-align: center;
}


/* CABECERA */

.game-header {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 15px;
}


.game-title {
    margin: 0;

    font-size: 28px;

    font-weight: 500;

    color: #202124;
}


.back-button {
    border: none;

    background: white;

    color: #1a73e8;

    border: 1px solid #dadce0;

    border-radius: 6px;

    padding: 8px 14px;

    cursor: pointer;

    font-size: 14px;
}


.back-button:hover {
    background: #f1f3f4;
}


/* =========================================
   CONTROLES
========================================= */

.controls {
    display: flex;

    justify-content: center;

    align-items: center;

    gap: 8px;

    flex-wrap: wrap;

    margin-bottom: 10px;
}


.controls label {
    color: #5f6368;

    font-size: 14px;
}


select,
.new-game-button {
    border: 1px solid #dadce0;

    background: white;

    color: #202124;

    border-radius: 6px;

    padding: 8px 12px;

    font-size: 14px;

    cursor: pointer;
}


.new-game-button {
    background: #1a73e8;

    color: white;

    border-color: #1a73e8;
}


.new-game-button:hover {
    background: #1765c1;
}


/* =========================================
   ESTADO
========================================= */

#status {
    min-height: 25px;

    margin: 8px 0 10px;

    font-size: 17px;

    font-weight: 500;

    color: #202124;
}


/* =========================================
   TABLERO
========================================= */

.board {
    width: 480px;

    height: 480px;

    max-width: 90vw;

    max-height: 90vw;

    margin: auto;

    display: grid;

    grid-template-columns: repeat(8, 1fr);

    grid-template-rows: repeat(8, 1fr);

    border: 4px solid #3c4043;

    box-shadow:
        0 3px 10px rgba(0,0,0,.2);
}


.square {
    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    cursor: pointer;

    user-select: none;
}


.light {
    background: #f0d9b5;
}


.dark {
    background: #b58863;
}


/* =========================================
   PIEZAS
========================================= */

.piece {
    font-size: 42px;

    line-height: 1;

    pointer-events: none;

    position: relative;

    z-index: 2;

    text-shadow:
        1px 2px 2px rgba(0,0,0,.45);
}


.white-piece {
    color: white;
}


.black-piece {
    color: #111;
}


/* PIEZA SELECCIONADA */

.selected {
    box-shadow:
        inset 0 0 0 4px #34a853;
}


/* MOVIMIENTO POSIBLE */

.possible::after {
    content: "";

    position: absolute;

    width: 15px;

    height: 15px;

    border-radius: 50%;

    background: rgba(0,0,0,.3);
}


/* CAPTURA */

.capture {
    box-shadow:
        inset 0 0 0 4px #ea4335;
}


/* JAQUE */

.check {
    box-shadow:
        inset 0 0 0 5px #ea4335;
}


/* INFORMACIÓN */

.info {
    margin-top: 10px;

    color: #5f6368;

    font-size: 13px;
}


/* =========================================
   RESPONSIVE
========================================= */

@media (max-width: 550px) {

    .title {
        font-size: 42px;
    }

    .logo {
        font-size: 65px;
    }

    .board {
        width: 90vw;
        height: 90vw;
    }

    .piece {
        font-size: 9.5vw;
    }

    .game-header {
        padding: 0 5px;
    }

}

</style>
</head>


<body>


<!-- =======================================
     PANTALLA DE INICIO
======================================= -->

<section id="home">

    <div class="logo">
        ♟
    </div>

    <h1 class="title">
        Ajedrez
    </h1>

    <div class="subtitle">
        Juega una partida de ajedrez
    </div>

    <button
        class="start-button"
        id="startButton"
    >
        Inicio
    </button>

</section>



<!-- =======================================
     PANTALLA DEL JUEGO
======================================= -->

<section id="game">

    <div class="game-container">


        <div class="game-header">

            <h1 class="game-title">
                ♟ Ajedrez
            </h1>

            <button
                class="back-button"
                id="backButton"
            >
                ← Inicio
            </button>

        </div>


        <div class="controls">

            <label>
                Modo:
            </label>


            <select id="mode">

                <option value="2">
                    2 jugadores
                </option>

                <option value="1">
                    1 jugador vs computadora
                </option>

            </select>


            <button
                class="new-game-button"
                id="newGame"
            >
                Nueva partida
            </button>

        </div>


        <div id="status">
            Turno: Blancas
        </div>


        <div id="board" class="board"></div>


        <div class="info">
            Haz clic en una pieza y después en la casilla donde quieres moverla.
        </div>

    </div>

</section>



<script>

/* =========================================
   PANTALLAS
========================================= */

const home =
    document.getElementById("home");

const game =
    document.getElementById("game");

const startButton =
    document.getElementById("startButton");

const backButton =
    document.getElementById("backButton");


/* IR AL JUEGO */

startButton.addEventListener(
    "click",
    function() {

        home.style.display = "none";

        game.style.display = "block";

    }
);


/* VOLVER AL INICIO */

backButton.addEventListener(
    "click",
    function() {

        game.style.display = "none";

        home.style.display = "flex";

    }
);


/* =========================================
   AJEDREZ
========================================= */

let chess =
    new Chess();

let selectedSquare =
    null;

let computerThinking =
    false;


/* =========================================
   PIEZAS
========================================= */

const symbols = {

    wp: "♙",
    wr: "♖",
    wn: "♘",
    wb: "♗",
    wq: "♕",
    wk: "♔",

    bp: "♟",
    br: "♜",
    bn: "♞",
    bb: "♝",
    bq: "♛",
    bk: "♚"

};


/* =========================================
   ELEMENTOS
========================================= */

const boardElement =
    document.getElementById("board");

const statusElement =
    document.getElementById("status");

const modeElement =
    document.getElementById("mode");

const newGameButton =
    document.getElementById("newGame");


/* =========================================
   NUEVA PARTIDA
========================================= */

function newGame() {

    chess.reset();

    selectedSquare = null;

    computerThinking = false;

    drawBoard();

    updateStatus();

}


/* =========================================
   DIBUJAR TABLERO
========================================= */

function drawBoard() {

    boardElement.innerHTML = "";

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const square =
                document.createElement("div");


            square.className =
                "square " +
                (
                    (row + col) % 2 === 0
                        ? "light"
                        : "dark"
                );


            const file =
                String.fromCharCode(
                    97 + col
                );

            const rank =
                8 - row;

            const squareName =
                file + rank;


            square.dataset.square =
                squareName;


            /* SELECCIONADA */

            if (
                selectedSquare ===
                squareName
            ) {

                square.classList.add(
                    "selected"
                );

            }


            /* MOVIMIENTOS */

            if (selectedSquare) {

                const moves =
                    chess.moves({
                        square:
                            selectedSquare,

                        verbose: true
                    });


                const move =
                    moves.find(
                        m =>
                            m.to ===
                            squareName
                    );


                if (move) {

                    if (move.captured) {

                        square.classList.add(
                            "capture"
                        );

                    } else {

                        square.classList.add(
                            "possible"
                        );

                    }

                }

            }


            /* PIEZA */

            const piece =
                board[row][col];


            if (piece) {

                const element =
                    document.createElement(
                        "span"
                    );


                element.className =
                    "piece " +
                    (
                        piece.color === "w"
                            ? "white-piece"
                            : "black-piece"
                    );


                element.textContent =
                    symbols[
                        piece.color +
                        piece.type
                    ];


                square.appendChild(
                    element
                );

            }


            square.addEventListener(
                "click",
                function() {

                    handleSquareClick(
                        squareName
                    );

                }
            );


            boardElement.appendChild(
                square
            );

        }

    }


    /* REY EN JAQUE */

    if (chess.in_check()) {

        const kingSquare =
            findKingSquare(
                chess.turn()
            );


        if (kingSquare) {

            const kingElement =
                document.querySelector(
                    `[data-square="${kingSquare}"]`
                );


            if (kingElement) {

                kingElement.classList.add(
                    "check"
                );

            }

        }

    }

}


/* =========================================
   ENCONTRAR REY
========================================= */

function findKingSquare(color) {

    const board =
        chess.board();


    for (
        let row = 0;
        row < 8;
        row++
    ) {

        for (
            let col = 0;
            col < 8;
            col++
        ) {

            const piece =
                board[row][col];


            if (
                piece &&
                piece.color === color &&
                piece.type === "k"
            ) {

                return (
                    String.fromCharCode(
                        97 + col
                    ) +
                    (8 - row)
                );

            }

        }

    }


    return null;

}


/* =========================================
   CLICK
========================================= */

function handleSquareClick(square) {

    if (
        chess.game_over()
    ) {
        return;
    }


    if (computerThinking) {
        return;
    }


    /* La computadora juega negras */

    if (
        modeElement.value === "1" &&
        chess.turn() === "b"
    ) {

        return;

    }


    const piece =
        chess.get(square);


    /* YA HAY SELECCIÓN */

    if (selectedSquare) {

        const moves =
            chess.moves({
                square:
                    selectedSquare,

                verbose: true
            });


        const move =
            moves.find(
                m =>
                    m.to === square
            );


        /* MOVIMIENTO VÁLIDO */

        if (move) {

            chess.move({

                from:
                    selectedSquare,

                to:
                    square,

                promotion:
                    "q"

            });


            selectedSquare = null;

            drawBoard();

            updateStatus();


            /* COMPUTADORA */

            if (
                !chess.game_over() &&
                modeElement.value === "1" &&
                chess.turn() === "b"
            ) {

                computerThinking = true;

                setTimeout(
                    computerMove,
                    500
                );

            }


            return;

        }


        /* OTRA PIEZA */

        if (
            piece &&
            piece.color ===
            chess.turn()
        ) {

            selectedSquare =
                square;

            drawBoard();

            return;

        }


        selectedSquare = null;

        drawBoard();

        return;

    }


    /* SELECCIONAR */

    if (
        piece &&
        piece.color ===
        chess.turn()
    ) {

        selectedSquare =
            square;

        drawBoard();

    }

}


/* =========================================
   COMPUTADORA
========================================= */

function computerMove() {

    if (
        chess.game_over() ||
        chess.turn() !== "b"
    ) {

        computerThinking = false;

        return;

    }


    const moves =
        chess.moves({
            verbose: true
        });


    if (
        moves.length === 0
    ) {

        computerThinking = false;

        updateStatus();

        return;

    }


    /*
     * Preferir capturas
     */

    const captures =
        moves.filter(
            move =>
                move.captured
        );


    let choices =
        captures.length > 0
            ? captures
            : moves;


    /*
     * Buscar jaques
     */

    const checks =
        choices.filter(
            move => {

                const test =
                    new Chess(
                        chess.fen()
                    );


                try {

                    test.move({

                        from:
                            move.from,

                        to:
                            move.to,

                        promotion:
                            "q"

                    });


                    return test.in_check();

                } catch {

                    return false;

                }

            }
        );


    if (
        checks.length > 0
    ) {

        choices = checks;

    }


    /* Elegir */

    const move =
        choices[
            Math.floor(
                Math.random() *
                choices.length
            )
        ];


    chess.move({

        from:
            move.from,

        to:
            move.to,

        promotion:
            "q"

    });


    computerThinking = false;

    drawBoard();

    updateStatus();

}


/* =========================================
   ESTADO
========================================= */

function updateStatus() {

    if (
        chess.in_checkmate()
    ) {

        const winner =
            chess.turn() === "w"
                ? "negras"
                : "blancas";


        statusElement.textContent =
            "🏆 ¡Jaque mate! Ganan las " +
            winner +
            ".";


        return;

    }


    if (
        chess.in_stalemate()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por ahogado!";

        return;

    }


    if (
        chess.isThreefoldRepetition()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas por repetición!";

        return;

    }


    if (
        chess.insufficient_material()
    ) {

        statusElement.textContent =
            "🤝 ¡Tablas! Material insuficiente.";

        return;

    }


    const turnText =
        chess.turn() === "w"
            ? "Blancas"
            : "Negras";


    statusElement.textContent =
        chess.in_check()
            ? "⚠️ ¡Jaque! Turno: " + turnText
            : "Turno: " + turnText;

}


/* =========================================
   BOTONES
========================================= */

newGameButton.addEventListener(
    "click",
    newGame
);


modeElement.addEventListener(
    "change",
    newGame
);


/* =========================================
   INICIAR
========================================= */

newGame();

</script>

</body>
</html>
